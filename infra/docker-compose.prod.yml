name: erp-nucleus-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-erp_nucleus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-erp_nucleus}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-off: `docker compose -f docker-compose.prod.yml run --rm migrate`.
  # Not part of the default `up` — migrations are a deliberate, reviewed
  # step, not something that should silently fire on every restart.
  # Phase 17C-RLS: bootstraps erp_migrate/erp_app (idempotent) then runs
  # Alembic as erp_migrate — the only place the bootstrap superuser
  # credential (.env.migrate.production's DATABASE_URL_BOOTSTRAP_SYNC) is
  # ever used. api/worker never see it.
  migrate:
    build:
      context: ../backend
      target: production
    env_file:
      - ../backend/.env.migrate.production
    command: ["sh", "-c", "python -m src.scripts.bootstrap_db_roles && alembic upgrade head"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  api:
    build:
      context: ../backend
      target: production
    env_file:
      - ../backend/.env.production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      target: production
    command: celery -A src.workers.celery_app worker --loglevel=info
    env_file:
      - ../backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        # No /api suffix — the frontend code already prepends the full
        # /api/v1/... path to every request; this is just the public origin
        # nginx listens on (see nginx.conf's /api/ location).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
