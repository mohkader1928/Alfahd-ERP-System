name: erp-nucleus

services:
  postgres:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      POSTGRES_DB: erp_nucleus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_nucleus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: `docker compose --profile tools run --rm migrate`. Phase
  # 17C-RLS: bootstraps erp_migrate/erp_app (idempotent) then runs Alembic
  # as erp_migrate. Not part of the default `up` — mirrors
  # docker-compose.prod.yml's existing migrate service. Run this (and wait
  # for it to finish) before starting api/worker on a fresh checkout or
  # after pulling new migrations.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env.migrate
    command: sh -c "python -m src.scripts.bootstrap_db_roles && alembic upgrade head"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  api:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A src.workers.celery_app worker --loglevel=info
    restart: unless-stopped
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
