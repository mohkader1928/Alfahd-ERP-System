# Hybrid Production override.
#
# Keeps the existing erp-nucleus PostgreSQL/Redis infrastructure while
# converting API and Worker to immutable release containers.
#
# IMPORTANT:
# Use together with infra/docker-compose.yml.
# ALFAHD_BACKEND_IMAGE must identify the exact approved release artifact.
# Do not deploy without the release runbook and Owner approval.

services:
  api:
    image: "${ALFAHD_BACKEND_IMAGE:?ALFAHD_BACKEND_IMAGE is required}"
    build: !reset null
    volumes: !reset []

  worker:
    image: "${ALFAHD_BACKEND_IMAGE:?ALFAHD_BACKEND_IMAGE is required}"
    build: !reset null
    volumes: !reset []
